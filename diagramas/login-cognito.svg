size="12.5" font-weight="bold" fill="#1b1b1b">Cognito</text><text x="555.0" y="79.375" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#455a64">User Pool</text><rect x="480" y="175" width="150" height="56" rx="7" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.6"/><text x="555.0" y="200.375" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1b1b1b">API Gateway</text><text x="555.0" y="214.375" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#455a64">authorizer Cognito</text><rect x="690" y="175" width="100" height="56" rx="7" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.6"/><text x="740.0" y="200.375" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1b1b1b">λ Lambda</text><text x="740.0" y="214.375" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#455a64">de negocio</text><path d="M810,182 a40.0,7 0 0 1 80,0 v42 a40.0,7 0 0 1 -80,0 z" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><path d="M810,182 a40.0,7 0 0 0 80,0" fill="none" stroke="#1565c0" stroke-width="1.2"/><text x="850.0" y="212.275" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1b1b1b">DynamoDB</text><path d="M100.0,65.0 L170.0,65.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M290.0,52.5 L480.0,54.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M480.0,84.8 L290.0,80.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M230.0,90.0 L230.0,203.0 L480.0,203.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M555.0,175.0 L555.0,96.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M630.0,203.0 L690.0,203.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M790.0,203.0 L810.0,203.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><rect x="106.4" y="35.0" width="57.1" height="27.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="135.0" y="46.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">1 abre</text><text x="135.0" y="58.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">el portal</text><rect x="312.8" y="45.8" width="144.5" height="15.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="385.0" y="56.8" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">2 login (usuario + clave)</text><rect x="293.6" y="74.9" width="182.7" height="15.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="385.0" y="85.9" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">3 devuelve JWT (id/access token)</text><rect x="247.3" y="185.0" width="215.5" height="15.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="355.0" y="196.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">4 petición + header Authorization: JWT</text><rect x="512.8" y="122.0" width="84.4" height="27.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="555.0" y="133.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">5 valida firma</text><text x="555.0" y="145.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">y expiración</text><rect x="634.2" y="173.0" width="51.7" height="27.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="660.0" y="184.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">6 invoca</text><text x="660.0" y="196.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">+ claims</text><rect x="782.4" y="185.0" width="35.3" height="15.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="800.0" y="196.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">7 R/W</text><rect x="10" y="245" width="880" height="39.0" rx="4" fill="#fff8e1" stroke="#e0a800" stroke-width="1.2"/><text x="18" y="261.0" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="11.0" fill="#5d4600">Token faltante o inválido → API Gateway responde 401 y la Lambda NO se ejecuta. Los claims (sub, cognito:groups, custom:*) llegan a la Lambda para decidir</text><text x="18" y="274.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="11.0" fill="#5d4600">qué datos puede ver. Cognito reemplaza la tabla usuarios y el hash de contraseñas: no guardas contraseñas en tu BD.</text><rect x="8" y="308" width="12" height="12" rx="2" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/><text x="25" y="318.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Usuario / externo</text><rect x="130.8" y="308" width="12" height="12" rx="2" fill="#e0f2f1" stroke="#00796b" stroke-width="1.3"/><text x="147.8" y="318.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Frontend (Amplify)</text><rect x="259.0" y="308" width="12" height="12" rx="2" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/><text x="276.0" y="318.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Seguridad (Cognito, Secrets, KMS)</text><rect x="468.20000000000005" y="308" width="12" height="12" rx="2" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.3"/><text x="485.20000000000005" y="318.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">API Gateway</text><rect x="558.6" y="308" width="12" height="12" rx="2" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.3"/><text x="575.6" y="318.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Lambda / cómputo</text><rect x="676.0" y="308" width="12" height="12" rx="2" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/><text x="693.0" y="318.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Base de datos</text><rect x="8" y="325" width="12" height="12" rx="2" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.3"/><text x="25" y="335.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">S3</text><rect x="49.8" y="325" width="12" height="12" rx="2" fill="#fce4ec" stroke="#d81b60" stroke-width="1.3"/><text x="66.8" y="335.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Mensajería (SNS, SQS, EventBridge)</text><rect x="264.40000000000003" y="325" width="12" height="12" rx="2" fill="#f5f5f5" stroke="#757575" stroke-width="1.3"/><text x="281.40000000000003" y="335.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Observabilidad</text><path d="M8,345 L44,345" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><text x="52" y="349" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">síncrona (S): el que llama espera respuesta</text><path d="M270,345 L306,345" stroke="#ad1457" stroke-width="1.7" stroke-dasharray="7 4" marker-end="url(#ma)"/><text x="314" y="349" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">asíncrona (A): deja un evento/mensaje y sigue</text><path d="M560,345 L596,345" stroke="#c62828" stroke-width="1.9" stroke-dasharray="2 3" marker-end="url(#me)"/><text x="604" y="349" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">fallo / reintentos → DLQ</text></svg>