al,sans-serif" font-size="12.5" font-weight="bold" fill="#1b1b1b">λ verHistoria</text><path d="M640,67 a105.0,7 0 0 1 210,0 v42 a105.0,7 0 0 1 -210,0 z" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/><path d="M640,67 a105.0,7 0 0 0 210,0" fill="none" stroke="#1565c0" stroke-width="1.2"/><text x="745.0" y="90.275" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="12.5" font-weight="bold" fill="#1b1b1b">historias</text><text x="745.0" y="104.275" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#455a64">PK id_paciente</text><path d="M130.0,88.0 L200.0,88.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M350.0,88.0 L420.0,88.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><path d="M570.0,88.0 L640.0,88.0" fill="none" stroke="#37474f" stroke-width="1.7" marker-end="url(#ms)"/><rect x="125.5" y="70.0" width="79.0" height="15.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="165.0" y="81.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">GET /historia</text><rect x="364.6" y="70.0" width="40.8" height="15.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="385.0" y="81.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">claims</text><rect x="557.3" y="70.0" width="95.4" height="15.0" rx="3" fill="#ffffff" fill-opacity="0.93"/><text x="605.0" y="81.0" text-anchor="middle" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10.5" fill="#37474f">query PK = claim</text><rect x="10" y="140" width="840" height="39.0" rx="4" fill="#fff8e1" stroke="#e0a800" stroke-width="1.2"/><text x="18" y="156.0" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="11.0" fill="#5d4600">La Lambda IGNORA el id que venga en la URL/body y usa claims[custom:id_paciente] (o sub) como clave de partición: el paciente solo consulta su propia</text><text x="18" y="169.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="11.0" fill="#5d4600">partición. Personal: se valida claims[cognito:groups] (medicos, recepcion…).</text><rect x="8" y="218" width="12" height="12" rx="2" fill="#eceff1" stroke="#546e7a" stroke-width="1.3"/><text x="25" y="228.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Usuario / externo</text><rect x="130.8" y="218" width="12" height="12" rx="2" fill="#e0f2f1" stroke="#00796b" stroke-width="1.3"/><text x="147.8" y="228.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Frontend (Amplify)</text><rect x="259.0" y="218" width="12" height="12" rx="2" fill="#ffebee" stroke="#c62828" stroke-width="1.3"/><text x="276.0" y="228.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Seguridad (Cognito, Secrets, KMS)</text><rect x="468.20000000000005" y="218" width="12" height="12" rx="2" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.3"/><text x="485.20000000000005" y="228.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">API Gateway</text><rect x="558.6" y="218" width="12" height="12" rx="2" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.3"/><text x="575.6" y="228.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Lambda / cómputo</text><rect x="676.0" y="218" width="12" height="12" rx="2" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.3"/><text x="693.0" y="228.5" font-family="'Adwaita Sans','FreeSans','DejaVu Sans',Arial,sans-serif" font-size="10" fill="#37474f">Base de datos</text><rect x="8" y="235" width="12" height="12" rx="2" fill="#e8f